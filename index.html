<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상장사 M&A 데일리</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1><a href="index.html">상장사 M&A 데일리</a></h1>
  <p>딜클로징 리스트 실시간 업데이트</p>
</header>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main>
    <div class="controls">
      <input id="q" type="search" placeholder="회사명 또는 종목코드 검색">
    </div>
    <div class="chips" id="chips"></div>
    <div class="toggle-row">
      <input type="checkbox" id="showMinor">
      <label for="showMinor">정정·자회사 공시 등 상세정보 없는 공시도 표시</label>
    </div>
    <div id="list"></div>
    <footer>본 페이지는 DART 공시를 자동 분류·요약한 참고 자료이며, 정확한 내용은 원문 공시를 확인하세요.</footer>
  </main>
  <aside class="news-panel" id="newsPanel"></aside>
</div>

<script src="sidebar.js"></script>
<script>
renderSidebar("daily");
renderNewsPanel();

let deals = [];
let category = "전체";
let showMinor = false;
const listEl = document.getElementById("list");
const chipsEl = document.getElementById("chips");
const qEl = document.getElementById("q");
const showMinorEl = document.getElementById("showMinor");

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtDate(d) {
  return d.slice(0,4) + "." + d.slice(4,6) + "." + d.slice(6,8);
}

function detailHtml(d) {
  if (d.summary) {
    return '<div class="summary-line">' + esc(d.summary) + '</div>';
  }
  if (d.no_detail_api) {
    return '<div class="no-detail-line">DART 상세 공시 API에 정보가 없는 유형입니다 (원문 확인 필요)</div>';
  }
  return '<div class="no-detail-line">상세정보 확인 중…</div>';
}

function render() {
  const q = qEl.value.trim().toLowerCase();
  const rows = deals.filter(d =>
    (category === "전체" || d.category === category) &&
    (showMinor || !d.no_detail_api) &&
    (!q || d.corp_name.toLowerCase().includes(q) || d.stock_code.includes(q))
  );
  if (!rows.length) {
    listEl.innerHTML = '<div class="empty">표시할 공시가 없습니다.</div>';
    return;
  }
  let html = "", lastDate = "";
  for (const d of rows) {
    if (d.date !== lastDate) {
      html += '<div class="day">' + fmtDate(d.date) + "</div>";
      lastDate = d.date;
    }
    html += '<div class="deal"><a href="detail.html?no=' + encodeURIComponent(d.rcept_no)
      + '"><div class="top"><span class="name">' + esc(d.corp_name)
      + '</span><span class="tag">' + esc(d.category + (d.direction ? " · " + d.direction : "")) + '</span></div>' + detailHtml(d) + '<div class="title">'
      + esc(d.report_nm) + "</div></a></div>";
  }
  listEl.innerHTML = html;
}

function renderChips() {
  const cats = ["전체", ...new Set(deals.map(d => d.category))];
  chipsEl.innerHTML = cats.map(c =>
    '<button class="chip' + (c === category ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + "</button>"
  ).join("");
}

chipsEl.addEventListener("click", e => {
  if (e.target.dataset.c) { category = e.target.dataset.c; renderChips(); render(); }
});
qEl.addEventListener("input", render);
showMinorEl.addEventListener("change", () => { showMinor = showMinorEl.checked; render(); });

fetch("deals.json?t=" + Date.now())
  .then(r => { if (!r.ok) throw new Error(); return r.json(); })
  .then(data => { deals = data; renderChips(); render(); })
  .catch(() => {
    listEl.innerHTML = '<div class="empty">아직 수집된 데이터가 없습니다. 자동 수집이 한 번 실행되면 표시됩니다.</div>';
  });
</script>
</body>
</html>
