<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상장사 M&A 데일리</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2430; --sub:#6b7686; --line:#e3e7ec; --accent:#1f4e9c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  header { background:var(--accent); color:#fff; padding:24px 16px; }
  header h1 { margin:0 0 4px; font-size:22px; }
  header p { margin:0; font-size:13px; opacity:.85; }
  main { max-width:820px; margin:0 auto; padding:16px; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .controls input { flex:1 1 200px; padding:10px 12px; border:1px solid var(--line);
                    border-radius:8px; font-size:15px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
  .chip { padding:6px 12px; border:1px solid var(--line); background:var(--card);
          border-radius:999px; font-size:13px; cursor:pointer; }
  .chip.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .day { margin:20px 0 8px; font-size:14px; font-weight:700; color:var(--sub); }
  .deal { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:12px 14px; margin-bottom:8px; }
  .deal a { color:inherit; text-decoration:none; display:block; }
  .top { display:flex; justify-content:space-between; gap:8px; align-items:center; }
  .name { font-weight:700; font-size:16px; }
  .tag { font-size:12px; background:#e8effa; color:var(--accent); padding:3px 8px;
         border-radius:6px; white-space:nowrap; }
  .title { margin-top:6px; font-size:14px; color:var(--sub); }
  .detail { margin-top:8px; display:flex; flex-wrap:wrap; gap:4px 16px; font-size:13px; color:var(--sub); }
  .detail b { color:var(--text); }
  .empty, footer { text-align:center; color:var(--sub); font-size:13px; padding:24px 0; }
</style>
</head>
<body>
<header>
  <h1>상장사 M&amp;A 데일리</h1>
  <p>DART 공시 기반 · 매일 오전 자동 업데이트</p>
</header>
<main>
  <div class="controls">
    <input id="q" type="search" placeholder="회사명 또는 종목코드 검색">
  </div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
  <footer>본 페이지는 DART 공시를 자동 분류한 참고 자료이며, 정확한 내용은 원문 공시를 확인하세요.</footer>
</main>

<script>
let deals = [];
let category = "전체";
const listEl = document.getElementById("list");
const chipsEl = document.getElementById("chips");
const qEl = document.getElementById("q");

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtDate(d) {
  return d.slice(0,4) + "." + d.slice(4,6) + "." + d.slice(6,8);
}

const TARGET_LABEL = {"타법인 주식 취득·처분":"대상회사", "영업양수도":"대상 영업", "합병":"합병 상대"};

function fmtWon(n) {
  if (n == null) return "";
  if (n >= 1e12) return (n / 1e12).toFixed(2).replace(/\.?0+$/, "") + "조원";
  if (n >= 1e8) return Math.round(n / 1e8).toLocaleString() + "억원";
  if (n >= 1e4) return Math.round(n / 1e4).toLocaleString() + "만원";
  return n.toLocaleString() + "원";
}

function detailHtml(d) {
  const parts = [];
  if (d.target) parts.push((TARGET_LABEL[d.category] || "대상") + ": <b>" + esc(d.target) + "</b>");
  if (d.counterparty) parts.push("거래상대방: <b>" + esc(d.counterparty) + "</b>");
  if (d.amount != null) parts.push((d.category === "유상증자" ? "조달금액" : "딜 규모") + ": <b>" + fmtWon(d.amount) + "</b>");
  if (d.note) parts.push(esc(d.note));
  if (!parts.length) return "";
  return '<div class="detail">' + parts.map(p => "<span>" + p + "</span>").join("") + "</div>";
}

function render() {
  const q = qEl.value.trim().toLowerCase();
  const rows = deals.filter(d =>
    (category === "전체" || d.category === category) &&
    (!q || d.corp_name.toLowerCase().includes(q) || d.stock_code.includes(q))
  );
  if (!rows.length) {
    listEl.innerHTML = '<div class="empty">표시할 공시가 없습니다.</div>';
    return;
  }
  let html = "", lastDate = "";
  for (const d of rows) {
    if (d.date !== lastDate) {
      html += '<div class="day">' + fmtDate(d.date) + "</div>";
      lastDate = d.date;
    }
    html += '<div class="deal"><a target="_blank" rel="noopener" href="https://dart.fss.or.kr/dsaf001/main.do?rcpNo='
      + esc(d.rcept_no) + '"><div class="top"><span class="name">' + esc(d.corp_name)
      + '</span><span class="tag">' + esc(d.category + (d.direction ? " · " + d.direction : "")) + '</span></div>' + detailHtml(d) + '<div class="title">'
      + esc(d.report_nm) + "</div></a></div>";
  }
  listEl.innerHTML = html;
}

function renderChips() {
  const cats = ["전체", ...new Set(deals.map(d => d.category))];
  chipsEl.innerHTML = cats.map(c =>
    '<button class="chip' + (c === category ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + "</button>"
  ).join("");
}

chipsEl.addEventListener("click", e => {
  if (e.target.dataset.c) { category = e.target.dataset.c; renderChips(); render(); }
});
qEl.addEventListener("input", render);

fetch("deals.json?t=" + Date.now())
  .then(r => { if (!r.ok) throw new Error(); return r.json(); })
  .then(data => { deals = data; renderChips(); render(); })
  .catch(() => {
    listEl.innerHTML = '<div class="empty">아직 수집된 데이터가 없습니다. 자동 수집이 한 번 실행되면 표시됩니다.</div>';
  });
</script>
</body>
</html>
