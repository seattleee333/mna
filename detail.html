<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>딜 상세 · ALL ABOUT M&A</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">ALL ABOUT M&amp;A</a>
    <nav class="top-nav" id="topNav"></nav>
  </div>
</header>
<div class="layout">
  <main>
    <a class="back" href="deals.html">← 목록으로</a>
    <div id="detailBox"><div class="empty">불러오는 중...</div></div>
  </main>
  <aside class="news-panel" id="newsPanel"></aside>
</div>

<script src="sidebar.js"></script>
<script>
renderSidebar("daily");
renderNewsPanel();

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtDate(d) {
  if (!d) return "-";
  return d.slice(0,4) + "." + d.slice(4,6) + "." + d.slice(6,8);
}
function fmtWon(n) {
  if (n == null) return "";
  if (n >= 1e12) return (n / 1e12).toFixed(2).replace(/\.?0+$/, "") + "조원";
  if (n >= 1e8) return Math.round(n / 1e8).toLocaleString() + "억원";
  if (n >= 1e4) return Math.round(n / 1e4).toLocaleString() + "만원";
  return n.toLocaleString() + "원";
}
const TARGET_LABEL = {"타법인 주식 취득·처분":"대상회사", "영업양수도":"대상 영업", "합병":"합병 상대"};

const params = new URLSearchParams(location.search);
const no = params.get("no");
const box = document.getElementById("detailBox");

fetch("deals.json?t=" + Date.now())
  .then(r => { if (!r.ok) throw new Error(); return r.json(); })
  .then(data => {
    const d = data.find(x => x.rcept_no === no);
    if (!d) {
      box.innerHTML = '<div class="empty">해당 공시를 찾을 수 없습니다.</div>';
      return;
    }
    document.title = d.corp_name + " · 딜 상세 · ALL ABOUT M&A";

    // summary/buyer/seller가 아직 없는 예전 스키마 데이터를 위한 임시 처리 (target/counterparty 필드 기반)
    let buyer = d.buyer, seller = d.seller;
    if (!buyer && !seller && (d.counterparty || d.target)) {
      if (/양수|취득|인수/.test(d.direction || "")) { buyer = d.corp_name; seller = d.counterparty || ""; }
      else if (/양도|처분/.test(d.direction || "")) { seller = d.corp_name; buyer = d.counterparty || ""; }
    }
    let parties = "";
    if (buyer || seller) {
      parties = '<div class="dt-parties">' +
        (buyer ? '<div class="party-card buyer"><div class="party-label">인수 / 존속</div><div class="party-name">' + esc(buyer) + '</div></div>' : '') +
        (seller ? '<div class="party-card seller"><div class="party-label">매도 / 상대방</div><div class="party-name">' + esc(seller) + '</div></div>' : '') +
        '</div>';
    }

    let rows = "";
    if (d.target) rows += '<div class="dt-row"><span>' + esc(TARGET_LABEL[d.category] || "대상") + '</span><b>' + esc(d.target) + '</b></div>';
    if (d.amount != null) rows += '<div class="dt-row"><span>' + (d.category === "유상증자" ? "조달금액" : "딜 규모") + '</span><b>' + fmtWon(d.amount) + '</b></div>';
    if (d.note) rows += '<div class="dt-row"><span>비고</span><b>' + esc(d.note) + '</b></div>';

    let fallbackText = "";
    if (!d.summary && (d.target || d.amount != null)) {
      const verb = /양수|취득|인수/.test(d.direction || "") ? "인수/취득합니다"
                 : /양도|처분/.test(d.direction || "") ? "양도/처분합니다"
                 : "관련 거래를 진행합니다";
      fallbackText = d.corp_name + "이(가) " + (d.counterparty ? d.counterparty + " 관련하여 " : "") +
        (d.target || d.category) + "을(를)" + (d.amount != null ? " " + fmtWon(d.amount) + "에" : "") + " " + verb + ".";
    }

    const summaryHtml = d.summary
      ? '<div class="dt-summary">' + esc(d.summary) + '</div>'
      : (fallbackText
          ? '<div class="dt-summary">' + esc(fallbackText) + '</div>'
          : (d.no_detail_api
              ? '<div class="dt-summary">이 공시는 DART 상세 공시 API에서 데이터를 제공하지 않는 유형입니다 (거래소 수시공시 등). 아래 "DART 원문 보기"에서 내용을 확인해주세요.</div>'
              : '<div class="dt-summary">상세정보를 아직 확인하지 못했습니다. 다음 자동 수집 후 다시 확인해주세요.</div>'));

    const top =
      '<div class="detail-top">' +
        '<div class="dt-tag">' + esc(d.category + (d.direction ? " · " + d.direction : "")) + '</div>' +
        '<h2>' + esc(d.corp_name) + '</h2>' +
        summaryHtml +
        parties +
        (rows ? '<div class="dt-rows">' + rows + '</div>' : '') +
      '</div>';

    const raw =
      '<div class="detail-raw">' +
        '<h3>공시 원문 정보</h3>' +
        '<div class="dr-row"><span>공시일자</span><b>' + fmtDate(d.date) + '</b></div>' +
        '<div class="dr-row"><span>시장구분</span><b>' + esc(d.market || "-") + '</b></div>' +
        '<div class="dr-row"><span>종목코드</span><b>' + esc(d.stock_code || "-") + '</b></div>' +
        '<div class="dr-row"><span>공시명</span><b>' + esc(d.report_nm) + '</b></div>' +
        '<div class="dr-row"><span>DART 원문</span><a target="_blank" rel="noopener" href="https://dart.fss.or.kr/dsaf001/main.do?rcpNo=' + esc(d.rcept_no) + '">원문 공시 보기 →</a></div>' +
      '</div>';

    box.innerHTML = top + raw;
  })
  .catch(() => {
    box.innerHTML = '<div class="empty">데이터를 불러올 수 없습니다.</div>';
  });
</script>
</body>
</html>
