<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매물·인수희망 리스트 · ALL ABOUT M&A</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">ALL ABOUT M&amp;A</a>
    <nav class="top-nav" id="topNav"></nav>
  </div>
</header>
<div class="layout">
  <main>
    <div class="tab-row">
      <button class="tab-btn on" data-t="sell">매물 리스트</button>
      <button class="tab-btn" data-t="buy">인수희망 리스트</button>
    </div>
    <div class="notice-line">매일경제 [M&amp;A 매물장터] · 한국경제 [M&amp;A 장터] 연재 기사에서만 발췌합니다 (2026년 9월~)</div>
    <div class="controls">
      <input id="q" type="search" placeholder="업종 또는 키워드 검색">
    </div>
    <div class="chips" id="chips"></div>
    <div id="list"><div class="empty">불러오는 중...</div></div>
    <div id="pageControls" class="page-controls"></div>
    <footer>기사 원문의 표·제목에 나온 사실 정보(업종·매출·특징 등)만 정리한 것이며, 매물·인수희망 기업명은 원문에서도 비공개입니다. 자세한 내용은 원문 기사를 확인하세요.</footer>
  </main>
  <aside class="news-panel" id="newsPanel"></aside>
</div>

<script src="sidebar.js"></script>
<script>
renderSidebar("listings");
renderNewsPanel();

let items = [];
let tab = "sell";
let outlet = "전체";
const PAGE_SIZE = 10;
const MORE_LIMIT = 2;
let revealBatches = 1;
let pageNum = null;

const listEl = document.getElementById("list");
const pageControlsEl = document.getElementById("pageControls");
const chipsEl = document.getElementById("chips");
const qEl = document.getElementById("q");
const tabBtns = document.querySelectorAll(".tab-btn");

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtPub(p) {
  const d = new Date(p);
  if (isNaN(d)) return p || "";
  return d.getFullYear() + "." + String(d.getMonth()+1).padStart(2,"0") + "." + String(d.getDate()).padStart(2,"0");
}
function fmtEok(v) {
  if (!v) return "";
  const s = String(v).trim();
  return /억|원/.test(s) ? s : s + "억원"; // 이미 "OO억원" 형태면 중복으로 "억원"을 또 붙이지 않는다
}

// 한 기사(article_link)에 여러 회사(A사/B사/C사 등)가 같이 실리는 경우가 많아,
// 기사 단위로 묶어서 하나의 표로 보여준다 (회사마다 카드를 반복하지 않도록).
function groupRows(rows) {
  const map = new Map();
  const order = [];
  for (const it of rows) {
    const key = it.outlet + "|" + it.article_link + "|" + it.pubDate;
    if (!map.has(key)) { map.set(key, []); order.push(key); }
    map.get(key).push(it);
  }
  return order.map(k => map.get(k));
}

function rowHtml(it, isBuy) {
  const label = it.label ? esc(it.label) : "-";
  if (isBuy) {
    const target = it.target_industry || it.industry || it.feature || "-";
    return '<tr><td class="lg-td-label">' + label + '</td>' +
      '<td>' + esc(target.length > 70 ? target.slice(0, 70) + "…" : target) + '</td>' +
      '<td>' + (it.budget ? esc(fmtEok(it.budget)) : "-") + '</td></tr>';
  }
  const industryText = it.industry || it.feature || "-";
  return '<tr><td class="lg-td-label">' + label + '</td>' +
    '<td>' + esc(industryText.length > 70 ? industryText.slice(0, 70) + "…" : industryText) + '</td>' +
    '<td>' + (it.revenue ? esc(fmtEok(it.revenue)) : "-") + '</td></tr>';
}

function groupHtml(group) {
  const first = group[0];
  const isBuy = first.type === "buy";
  const headCols = isBuy ? ["구분", "인수희망대상", "인수가능금액"] : ["구분", "업종", "연매출"];
  const theadHtml = "<tr>" + headCols.map(h => "<th>" + h + "</th>").join("") + "</tr>";
  const bodyHtml = group.map(it => rowHtml(it, isBuy)).join("");
  return '<div class="listing-group">' +
    '<div class="lg-head">' +
      '<span class="lg-source"><span class="lg-outlet' + (isBuy ? " tag-buy" : "") + '">' + esc(first.outlet) + '</span>' +
      '<span class="lg-date">' + fmtPub(first.pubDate) + '</span></span>' +
      '<a class="lg-detail" target="_blank" rel="noopener" href="' + esc(first.article_link) + '">상세보기 <span class="lg-arrow">→</span></a>' +
    '</div>' +
    '<div class="lg-table-wrap"><table class="lg-table"><thead>' + theadHtml + '</thead><tbody>' + bodyHtml + '</tbody></table></div>' +
  '</div>';
}

function filteredRows() {
  const q = qEl.value.trim().toLowerCase();
  return items.filter(it =>
    it.type === tab &&
    (outlet === "전체" || it.outlet === outlet) &&
    (!q || (it.industry || "").toLowerCase().includes(q) || (it.feature || "").toLowerCase().includes(q)
        || (it.target_industry || "").toLowerCase().includes(q) || it.article_title.toLowerCase().includes(q))
  );
}

function render() {
  revealBatches = 1;
  pageNum = null;
  renderPage(groupRows(filteredRows()));
}

function renderPage(rows) {
  if (!rows.length) {
    listEl.innerHTML = '<div class="empty">' + (tab === "buy" ? "표시할 인수희망 항목이 없습니다." : "표시할 매물 항목이 없습니다.") + '</div>';
    pageControlsEl.innerHTML = "";
    return;
  }
  if (pageNum === null) {
    const shown = Math.min(revealBatches * PAGE_SIZE, rows.length);
    listEl.innerHTML = rows.slice(0, shown).map(groupHtml).join("");
    if (shown >= rows.length) {
      pageControlsEl.innerHTML = "";
    } else if (revealBatches < MORE_LIMIT) {
      pageControlsEl.innerHTML = '<button class="more-btn" id="moreBtn">더보기</button>';
      document.getElementById("moreBtn").addEventListener("click", () => { revealBatches++; renderPage(rows); });
    } else {
      pageNum = MORE_LIMIT + 1;
      renderPage(rows);
    }
    return;
  }
  const totalPages = Math.ceil(rows.length / PAGE_SIZE);
  pageNum = Math.min(Math.max(pageNum, 1), totalPages);
  const start = (pageNum - 1) * PAGE_SIZE;
  listEl.innerHTML = rows.slice(start, start + PAGE_SIZE).map(groupHtml).join("");

  const pages = [];
  for (let p = 1; p <= totalPages; p++) {
    if (p === 1 || p === totalPages || Math.abs(p - pageNum) <= 1) pages.push(p);
    else if (pages[pages.length - 1] !== "…") pages.push("…");
  }
  let html = '<div class="pagination">';
  html += '<button class="page-arrow" data-p="' + (pageNum - 1) + '"' + (pageNum <= 1 ? " disabled" : "") + '>‹</button>';
  for (const p of pages) {
    html += p === "…" ? '<span class="page-ellipsis">…</span>'
      : '<button class="page-num' + (p === pageNum ? " on" : "") + '" data-p="' + p + '">' + p + '</button>';
  }
  html += '<button class="page-arrow" data-p="' + (pageNum + 1) + '"' + (pageNum >= totalPages ? " disabled" : "") + '>›</button>';
  html += '</div>';
  pageControlsEl.innerHTML = html;
  pageControlsEl.querySelectorAll("[data-p]").forEach(btn => {
    btn.addEventListener("click", () => {
      pageNum = parseInt(btn.dataset.p, 10);
      renderPage(rows);
      listEl.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  });
}

function renderChips() {
  const outlets = ["전체", ...new Set(items.filter(it => it.type === tab).map(it => it.outlet))];
  chipsEl.innerHTML = outlets.map(o =>
    '<button class="chip' + (o === outlet ? " on" : "") + '" data-o="' + esc(o) + '">' + esc(o) + "</button>"
  ).join("");
}

tabBtns.forEach(btn => {
  btn.addEventListener("click", () => {
    tab = btn.dataset.t;
    tabBtns.forEach(b => b.classList.toggle("on", b === btn));
    outlet = "전체";
    renderChips();
    render();
  });
});
chipsEl.addEventListener("click", e => {
  if (e.target.dataset.o) { outlet = e.target.dataset.o; renderChips(); render(); }
});
qEl.addEventListener("input", render);

fetch("listings.json?t=" + Date.now())
  .then(r => { if (!r.ok) throw new Error(); return r.json(); })
  .then(data => { items = data; renderChips(); render(); })
  .catch(() => {
    listEl.innerHTML = '<div class="empty">아직 수집된 항목이 없습니다. 자동 수집이 한 번 실행되면 표시됩니다.</div>';
  });
</script>
</body>
</html>
