<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALL ABOUT M&A</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">ALL ABOUT M&amp;A</a>
    <nav class="top-nav" id="topNav"></nav>
  </div>
</header>
<div class="layout">
  <main>
    <div class="controls">
      <input id="q" type="search" placeholder="회사명 또는 종목코드 검색">
    </div>
    <div class="chips" id="chips">
      <button class="chip on" data-c="전체">전체</button>
      <div class="chip-dropdown" id="chipDropdown">
        <button class="chip chip-dropdown-toggle" id="chipDropdownToggle">
          <span class="cdt-icon">▤</span>M&amp;A 종류 선택하기<span id="chipCount" class="cdt-count"></span>
          <span class="cdt-caret">▾</span>
        </button>
        <div class="chip-dropdown-panel" id="chipDropdownPanel">
          <div class="cdp-head">
            <span class="cdp-title">M&amp;A 유형 선택<em>중복 선택 가능</em></span>
            <button type="button" class="cdp-reset" id="chipReset">초기화</button>
          </div>
          <div class="type-grid" id="typeGrid"></div>
        </div>
      </div>
      <div class="market-seg" id="marketSeg" role="tablist">
        <button type="button" class="on" data-m="kr">국내</button>
        <button type="button" data-m="us">미국</button>
      </div>
    </div>
    <div id="usWrap" hidden>
      <div class="us-tabs" id="usTabs" role="tablist">
        <button type="button" class="on" data-u="deep">주요 딜 분석</button>
        <button type="button" data-u="all">전체 공시</button>
      </div>
      <div id="usDeep"></div>
      <div id="usAll" hidden>
        <div class="us-month-row"><label for="usMonth">공시 월</label><select id="usMonth"></select><span id="usCount" class="us-count"></span></div>
        <div class="notice-line" id="usNotice">미국 증권거래위원회(SEC) 8-K 공시 기준이며, 월별로 나누어 보여드려요</div>
        <div id="usSoon" class="us-soon" hidden></div>
        <div id="usList"></div>
      </div>
      <footer>본 내용은 미국 증권거래위원회(SEC) 공시와 기업 발표자료를 정리한 참고 자료이며, 정확한 내용은 원문을 확인하세요.</footer>
    </div>
    <div id="krWrap"><div class="toggle-row">
      <input type="checkbox" id="showMinor">
      <label for="showMinor">정정·자회사 공시 등 상세정보 없는 공시도 표시</label>
    </div>
    <div class="notice-line">상장사 딜만 공지되어있습니다</div>
    <div id="list"></div>
    <div id="pageControls" class="page-controls"></div></div>
    <footer>본 페이지는 공개자료를 기반으로 자동 정리한 참고 자료이며, 정확한 내용은 원문 공시를 확인하세요.</footer>
  </main>
  <aside class="news-panel" id="newsPanel"></aside>
</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="sidebar.js"></script>
<script>
renderSidebar("daily");
renderNewsPanel();

document.getElementById("marketSeg").addEventListener("click", function (e) {
  const b = e.target.closest("button[data-m]");
  if (!b) return;
  this.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  const us = b.dataset.m === "us";
  document.getElementById("usWrap").hidden = !us;
  if (us) loadUs();
  document.getElementById("krWrap").hidden = us;
  document.querySelector(".controls").hidden = us;
  document.getElementById("chipDropdown").hidden = us;
  document.querySelector("main > footer").hidden = us;
  document.querySelector('#chips .chip[data-c="전체"]').hidden = us;
});

document.getElementById("usTabs").addEventListener("click", function (e) {
  const b = e.target.closest("button[data-u]");
  if (!b) return;
  this.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  showUsPane(b.dataset.u);
});
function showUsPane(u) {
  document.getElementById("usDeep").hidden = u !== "deep";
  document.getElementById("usAll").hidden = u !== "all";
  if (u === "all") loadUsAll();
}

let usDeepLoaded = false;
function loadUs() {
  if (usDeepLoaded) return;
  usDeepLoaded = true;
  const box = document.getElementById("usDeep");
  box.innerHTML = '<div class="empty">불러오는 중…</div>';
  fetch("us_deals_deep.json?t=" + Date.now()).then(r => (r.ok ? r.json() : null)).catch(() => null).then(d => {
    if (!d || !d.deals) { box.innerHTML = '<div class="empty">분석 자료를 불러오지 못했습니다.</div>'; return; }
    const tcls = { "인수": "a", "매각": "s", "합병": "m" };
    const linkA = (u, l) => '<a target="_blank" rel="noopener" href="' + esc(u) + '">' + esc(l) + '</a>';
    let h = '<div class="notice-line">' + esc(d.month.replace("-", "년 ")) + '월 주요 딜 ' + d.deals.length + '건을 기업 발표자료와 보도를 읽고 정리했어요. 금액은 원문 표기 기준이고, "계산"이라고 적은 수치는 직접 계산한 대략치입니다.</div>';
    h += '<h2 class="dd-h">밸류에이션 한눈에</h2><div class="dd-tbl"><table><thead><tr><th>딜</th><th>가격</th><th>프리미엄</th><th>배수</th><th>시너지</th><th>시너지÷가격</th></tr></thead><tbody>' +
      d.val.map(v => '<tr><td class="nm">' + esc(v.n) + '</td><td>' + esc(v.p) + '</td><td>' + esc(v.pm) + '</td><td>' + esc(v.mu) + '</td><td>' + esc(v.sy) + '</td><td>' + esc(v.r) + '</td></tr>').join("") +
      '</tbody></table></div>';
    h += '<details class="dd-gloss"><summary>가격 용어 읽는 법</summary><ul>' +
      '<li><b>프리미엄</b> 발표 전 주가보다 얼마나 더 얹어 샀는지입니다. 괄호는 비교 기준(종가, 평균가)입니다.</li>' +
      '<li><b>EV(기업가치)</b> 시가총액에 순부채를 더한 회사 전체 값입니다. 지분 값만 말할 땐 자기자본가치라고 구분했습니다.</li>' +
      '<li><b>EV/EBITDA</b> 영업현금창출력의 몇 년치를 주고 샀는지입니다. 업종마다 보통 수준이 달라서 같은 업종끼리 비교해야 합니다.</li>' +
      '<li><b>시너지 반영 배수</b> 인수자가 비용 절감분을 이익에 더해 다시 계산한 배수입니다. 그만큼 싸게 산 것처럼 보이지만 달성해야 얻는 값입니다.</li>' +
      '<li><b>장부가 대비</b> 0.8배면 회사 순자산보다 싸게 샀다는 뜻입니다. 주택건설처럼 자산 중심 업종에서 자주 씁니다.</li>' +
      '<li><b>레이트 베이스 대비</b> 규제 유틸리티는 허용 수익이 투자 자산(레이트 베이스)에 비례해서 이 배수로 값을 매깁니다.</li>' +
      '<li><b>시너지÷가격</b> 목표 비용 절감액이 가격의 몇 %인지 보는 간이 지표입니다. 매출 시너지는 빠져 있습니다.</li></ul></details>';
    h += '<h2 class="dd-h">딜별 분석</h2>';
    for (const x of d.deals) {
      const srcs = x.src.map(s => linkA(s.u, s.l)).join(" · ");
      const fil = x.filings.map((u, i) => linkA(u, "SEC 공시" + (x.filings.length > 1 ? (i + 1) : ""))).join(" · ");
      h += '<article class="dd"><header><span class="dd-tag ' + (tcls[x.t] || "a") + '">' + esc(x.t) + '</span><h3>' + esc(x.ti) + '</h3><span class="dd-dt">' + esc(x.dt) + ' 공시</span></header>' +
        '<div class="dd-price">' + esc(x.pr) + '</div>' +
        '<dl><dt>두 회사</dt><dd>' + esc(x.who) + '</dd><dt>이유·시너지</dt><dd>' + esc(x.why) + '</dd><dt>가격 해석</dt><dd>' + esc(x.val) + '</dd></dl>' +
        '<footer><span class="dd-chips">' + x.chips.map(c => '<span class="dd-chip">' + esc(c) + '</span>').join("") + '</span><span class="dd-src">출처 ' + srcs + ' · ' + fil + '</span></footer></article>';
    }
    h += '<h2 class="dd-h">그 밖의 완료 딜 <em>공시 본문에서 확인되는 내용만 요약</em></h2><div class="dd-others">' +
      d.others.map(r => '<div class="dd-o"><span class="dd-tag ' + (tcls[r.t] || "a") + '">' + esc(r.t) + '</span><div><b>' + esc(r.ti) + '</b>' + (r.am ? ' <span class="dd-am">' + esc(r.am) + '</span>' : '') +
        '<p>' + esc(r.tx) + ' <span class="dd-ol">' + r.ln.map((u, i) => linkA(u, "공시" + (r.ln.length > 1 ? (i + 1) : ""))).join(" ") + '</span></p></div></div>').join("") + '</div>';
    box.innerHTML = h;
  });
}

let usAllLoaded = false, usAllDeals = [];
function loadUsAll() {
  if (usAllLoaded) return;
  usAllLoaded = true;
  const list = document.getElementById("usList"), soon = document.getElementById("usSoon");
  fetch("us_deals.json?t=" + Date.now()).then(r => (r.ok ? r.json() : null)).catch(() => null).then(d => {
    if (!d || !d.deals || !d.deals.length) {
      soon.hidden = false;
      soon.innerHTML = '<b>미국 딜을 모으는 중입니다.</b><p>수집이 끝나면 누가 누구를 얼마에 인수했는지 이곳에 정리됩니다.</p>';
      return;
    }
    usAllDeals = d.deals;
    const months = [...new Set(usAllDeals.map(x => x.date.slice(0, 6)))].sort().reverse();
    const sel = document.getElementById("usMonth");
    sel.innerHTML = months.map(m => '<option value="' + m + '">' + m.slice(0, 4) + '년 ' + parseInt(m.slice(4), 10) + '월</option>').join("");
    sel.onchange = renderUsAll;
    renderUsAll();
  });
}
function renderUsAll() {
  const list = document.getElementById("usList");
  const m = document.getElementById("usMonth").value;
  const rows = usAllDeals.filter(x => x.date.slice(0, 6) === m);
  document.getElementById("usCount").textContent = rows.length + "건";
  {
    let html = "", last = "";
    for (const x of rows) {
      if (x.date !== last) { html += '<div class="day">' + fmtDate(x.date) + "</div>"; last = x.date; }
      const main = x.summary_ko || (x.summary_en ? esc(x.summary_en) : null) ||
        (x.item === "2.01" ? esc(x.filer) + "이(가) 인수 또는 매각을 완료했다고 공시했습니다." : esc(x.filer) + "이(가) 인수 관련 계약을 체결했다고 공시했습니다.");
      const facts = [];
      if (x.acquirer) facts.push("인수: " + esc(x.acquirer));
      if (x.target) facts.push("대상: " + esc(x.target));
      if (x.amount) facts.push("금액: " + esc(x.amount));
      if (x.stake) facts.push("지분: " + esc(x.stake));
      html += '<div class="deal"><a target="_blank" rel="noopener" href="' + esc(x.url) + '"><div class="top"><span class="name">' + corpAvatar("", x.filer) +
        '<span>' + esc(x.filer) + '</span></span><span class="tag">' + esc(x.kind || "M&A") + '</span></div>' +
        '<div class="summary-line">' + (x.summary_ko ? esc(main) : main) + '</div>' +
        (facts.length ? '<div class="title">' + facts.join(" · ") + '</div>' : '<div class="title">SEC 8-K Item ' + esc(x.item) + ' · 원문 보기</div>') + '</a></div>';
    }
    list.innerHTML = html;
  }
}

let deals = [];
let selectedCats = new Set(); // 비어있으면 "전체" (복수 선택 가능)
const PRIORITY_CAT = "타법인 주식 취득·처분"; // M&A 종류 목록에서 맨 위에 둘 항목
let showMinor = false;
const PAGE_SIZE = 10;
const MORE_LIMIT = 2; // "더보기"로 최대 2배치(20개)까지 늘어난 뒤엔 페이지네이션으로 전환
let revealBatches = 1;
let pageNum = null; // null이면 "더보기" 단계, 숫자가 있으면 페이지네이션 단계
const listEl = document.getElementById("list");
const pageControlsEl = document.getElementById("pageControls");
const chipsEl = document.getElementById("chips");
const qEl = document.getElementById("q");
const showMinorEl = document.getElementById("showMinor");

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtDate(d) {
  return d.slice(0,4) + "." + d.slice(4,6) + "." + d.slice(6,8);
}

function fmtWon(n) {
  if (n == null) return "";
  if (n >= 1e12) return (n / 1e12).toFixed(2).replace(/\.?0+$/, "") + "조원";
  if (n >= 1e8) return Math.round(n / 1e8).toLocaleString() + "억원";
  if (n >= 1e4) return Math.round(n / 1e4).toLocaleString() + "만원";
  return n.toLocaleString() + "원";
}

// summary 필드가 아직 없는 예전 스키마 데이터를 위한 임시 요약 (target/counterparty 필드 기반)
function fallbackSummary(d) {
  if (!d.target && d.amount == null) return "";
  const other = d.counterparty || d.seller || d.buyer || "";
  let verb = "관련 거래를 진행합니다";
  if (/양수|취득|인수/.test(d.direction || "")) verb = "인수/취득합니다";
  else if (/양도|처분/.test(d.direction || "")) verb = "양도/처분합니다";
  let s = d.corp_name + "이(가) ";
  if (other) s += other + (verb.startsWith("양도") ? "에 " : "로부터 ");
  s += (d.target || d.category) + "을(를) ";
  if (d.amount != null) s += fmtWon(d.amount) + "에 ";
  s += verb + ".";
  return s;
}

function detailHtml(d) {
  if (d.summary) {
    return '<div class="summary-line">' + esc(d.summary) + '</div>';
  }
  const fb = fallbackSummary(d);
  if (fb) {
    return '<div class="summary-line">' + esc(fb) + '</div>';
  }
  if (d.no_detail_api) {
    return '<div class="no-detail-line">요약을 만들지 못한 공시입니다 (원문 확인 필요)</div>';
  }
  return '<div class="no-detail-line">상세정보 확인 중…</div>';
}

function cardsHtml(rows) {
  let html = "", lastDate = "";
  for (const d of rows) {
    if (d.date !== lastDate) {
      html += '<div class="day">' + fmtDate(d.date) + "</div>";
      lastDate = d.date;
    }
    html += '<div class="deal"><a href="detail.html?no=' + encodeURIComponent(d.rcept_no)
      + '"><div class="top"><span class="name">' + corpAvatar(d.stock_code, d.corp_name) + '<span>' + esc(d.corp_name) + '</span>'
      + '</span><span class="tag">' + esc(d.category + (d.direction ? " · " + d.direction : "")) + '</span></div>' + detailHtml(d) + '<div class="title">'
      + esc(d.report_nm) + "</div></a></div>";
  }
  return html;
}

function render() {
  const q = qEl.value.trim().toLowerCase();
  const rows = deals.filter(d =>
    (selectedCats.size === 0 || selectedCats.has(d.category)) &&
    (showMinor || !d.no_detail_api) &&
    (!q || d.corp_name.toLowerCase().includes(q) || d.stock_code.includes(q))
  );
  revealBatches = 1;
  pageNum = null;
  renderPage(rows);
}

function renderPage(rows) {
  if (!rows.length) {
    listEl.innerHTML = '<div class="empty">표시할 공시가 없습니다.</div>';
    pageControlsEl.innerHTML = "";
    return;
  }

  if (pageNum === null) {
    // "더보기" 단계: 10개 -> (더보기 클릭) 20개까지
    const shown = Math.min(revealBatches * PAGE_SIZE, rows.length);
    listEl.innerHTML = cardsHtml(rows.slice(0, shown));

    if (shown >= rows.length) {
      pageControlsEl.innerHTML = "";
    } else if (revealBatches < MORE_LIMIT) {
      pageControlsEl.innerHTML = '<button class="more-btn" id="moreBtn">더보기</button>';
      document.getElementById("moreBtn").addEventListener("click", () => {
        revealBatches++;
        renderPage(rows);
      });
    } else {
      // 20개까지 다 보여줬는데 더 남아있으면 페이지네이션으로 전환
      pageNum = MORE_LIMIT + 1;
      renderPage(rows);
    }
    return;
  }

  // 페이지네이션 단계
  const totalPages = Math.ceil(rows.length / PAGE_SIZE);
  pageNum = Math.min(Math.max(pageNum, 1), totalPages);
  const start = (pageNum - 1) * PAGE_SIZE;
  listEl.innerHTML = cardsHtml(rows.slice(start, start + PAGE_SIZE));

  // 페이지가 많을 땐 현재 페이지 주변 + 처음/끝만 보여주고 나머지는 "…"으로 생략
  const pages = [];
  for (let p = 1; p <= totalPages; p++) {
    if (p === 1 || p === totalPages || Math.abs(p - pageNum) <= 1) pages.push(p);
    else if (pages[pages.length - 1] !== "…") pages.push("…");
  }
  let html = '<div class="pagination">';
  html += '<button class="page-arrow" data-p="' + (pageNum - 1) + '"' + (pageNum <= 1 ? " disabled" : "") + '>‹</button>';
  for (const p of pages) {
    html += p === "…"
      ? '<span class="page-ellipsis">…</span>'
      : '<button class="page-num' + (p === pageNum ? " on" : "") + '" data-p="' + p + '">' + p + '</button>';
  }
  html += '<button class="page-arrow" data-p="' + (pageNum + 1) + '"' + (pageNum >= totalPages ? " disabled" : "") + '>›</button>';
  html += '</div>';
  pageControlsEl.innerHTML = html;
  pageControlsEl.querySelectorAll("[data-p]").forEach(btn => {
    btn.addEventListener("click", () => {
      pageNum = parseInt(btn.dataset.p, 10);
      renderPage(rows);
      listEl.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  });
}

function renderChips() {
  const cats = [...new Set(deals.map(d => d.category))];
  // "타법인 주식 취득·처분"을 목록 맨 위로 우선 배치
  cats.sort((a, b) => (a === PRIORITY_CAT ? -1 : b === PRIORITY_CAT ? 1 : 0));

  document.querySelector('[data-c="전체"]').classList.toggle("on", selectedCats.size === 0);

  const toggleBtn = document.getElementById("chipDropdownToggle");
  const countEl = document.getElementById("chipCount");
  toggleBtn.classList.toggle("on", selectedCats.size > 0);
  countEl.textContent = selectedCats.size > 0 ? selectedCats.size : "";
  countEl.classList.toggle("show", selectedCats.size > 0);

  document.getElementById("typeGrid").innerHTML = cats.map(c =>
    '<button type="button" class="type-option' + (selectedCats.has(c) ? " on" : "") +
    (c === PRIORITY_CAT ? " priority" : "") + '" data-c="' + esc(c) + '">' +
    '<span class="dot"></span><span class="type-label">' + esc(c) + "</span>" +
    (c === PRIORITY_CAT ? '<span class="priority-badge">자주 찾는 유형</span>' : "") +
    "</button>"
  ).join("");
}

function setDropdownOpen(open) {
  document.getElementById("chipDropdownPanel").classList.toggle("open", open);
  document.getElementById("chipDropdownToggle").classList.toggle("open", open);
}

chipsEl.addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (!btn) return;
  if (btn.id === "chipDropdownToggle") {
    const willOpen = !document.getElementById("chipDropdownPanel").classList.contains("open");
    setDropdownOpen(willOpen);
    return;
  }
  if (btn.id === "chipReset") {
    selectedCats.clear();
    renderChips(); render();
    return;
  }
  if (btn.dataset.c === "전체") {
    selectedCats.clear();
    setDropdownOpen(false);
    renderChips(); render();
    return;
  }
  if (btn.dataset.c) {
    // 패널 안의 항목은 중복 클릭(다중 선택)이 가능하도록 토글만 하고 패널은 열어둔다.
    if (selectedCats.has(btn.dataset.c)) selectedCats.delete(btn.dataset.c);
    else selectedCats.add(btn.dataset.c);
    renderChips(); render();
  }
});
document.addEventListener("click", e => {
  if (!document.getElementById("chipDropdown").contains(e.target)) {
    setDropdownOpen(false);
  }
});
qEl.addEventListener("input", render);
showMinorEl.addEventListener("change", () => { showMinor = showMinorEl.checked; render(); });

fetch("deals.json?t=" + Date.now())
  .then(r => { if (!r.ok) throw new Error(); return r.json(); })
  .then(data => { deals = data; renderChips(); render(); })
  .catch(() => {
    listEl.innerHTML = '<div class="empty">아직 수집된 데이터가 없습니다. 자동 수집이 한 번 실행되면 표시됩니다.</div>';
  });
</script>
</body>
</html>
