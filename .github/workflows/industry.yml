name: 업종별 M&A 사례 (DART)

on:
  workflow_dispatch:
    inputs:
      codes:
        description: "업종코드 직접 지정(쉼표 구분, 비우면 대표회사 기준 자동)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  industry:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: 업종 M&A 사례 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          INDUTY_CODES: ${{ github.event.inputs.codes }}
        run: python -u fetch_industry.py
      - name: 결과 저장
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          for f in industry_deals.json industry_cache.json industry_log.txt; do [ -f "$f" ] && git add "$f"; done
          if git diff --staged --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "update industry deals"
            for i in 1 2 3 4 5; do
              if git push; then break; fi
              git fetch origin main
              git rebase origin/main
              [ "$i" -eq 5 ] && exit 1
            done
          fi
