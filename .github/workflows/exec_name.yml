name: 상장사 임원 이름 검색

on:
  workflow_dispatch:
    inputs:
      name:
        description: 찾을 임원 이름
        default: 김동환
  push:
    paths:
      - fetch_exec_name.py

permissions:
  contents: write

concurrency:
  group: exec-name
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: 임원 이름 검색
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          EXEC_NAME: ${{ github.event.inputs.name || '김동환' }}
        run: python -u fetch_exec_name.py
      - name: 결과 저장
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          for f in exec_name_*.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --staged --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "update exec name"
            for i in 1 2 3 4 5; do
              if git push; then break; fi
              git fetch origin main
              git rebase origin/main
              [ "$i" -eq 5 ] && exit 1
            done
          fi
