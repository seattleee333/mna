name: 임시 점검 (애드포러스)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  chk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests openpyxl
      - name: 점검
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python -u check_adforus.py
      - name: 결과 저장
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          [ -f adforus_check.txt ] && git add adforus_check.txt
          git diff --staged --quiet || { git commit -m "adforus check"; for i in 1 2 3 4 5; do git push && break; git fetch origin main; git rebase origin/main; done; }
