name: 미국 전문검색 점검 (임시)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python -u us_probe.py
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - name: 저장
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add us_probe.txt
          git diff --staged --quiet || { git commit -m "us probe"; for i in 1 2 3 4; do git push && break; git fetch origin main; git rebase origin/main; done; }
