name: 한자 독음표 만들기

on:
  workflow_dispatch:
  push:
    paths:
      - build_hanja_map.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install hanja opencc
      - run: python -u build_hanja_map.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add hanja_map.json
          git diff --staged --quiet || (git commit -m "hanja map" && (git push || (git pull --rebase origin main && git push)))
