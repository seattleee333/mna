name: M&A 뉴스 수집

on:
  schedule:
    # 뉴스는 시간이 중요해서 하루 여러 번 가져온다. 새 기사가 없으면 아무것도 저장하지 않는다.
    - cron: "23 22 * * *"   # 한국시간 07:23
    - cron: "23 1 * * *"    # 한국시간 10:23
    - cron: "23 5 * * *"    # 한국시간 14:23
    - cron: "23 9 * * *"    # 한국시간 18:23
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-collect
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: M&A 뉴스 수집
        run: python fetch_news.py

      - name: 결과 저장
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add news.json
          if git diff --staged --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "update news"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "push 성공"
                break
              fi
              echo "push 실패, 재시도 ($i) - rebase 후 재시도"
              git fetch origin main
              git rebase origin/main
              if [ "$i" -eq 5 ]; then
                echo "push 5회 재시도 후 실패"
                exit 1
              fi
            done
          fi
