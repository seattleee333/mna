name: 오늘의 딜 포스팅 만들기

on:
  schedule:
    - cron: "50 22 * * *"   # 매일 07:50 KST
  workflow_dispatch:
  push:
    paths:
      - build_daily_post.py
      - render_cards.py
      - .github/workflows/daily_post.yml

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 playwright
      - name: 한글 글꼴·브라우저 설치
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk
          python -m playwright install --with-deps chromium
      - name: 오늘의 딜 고르기·글 만들기
        run: python -u build_daily_post.py
      - name: 카드 이미지 만들기
        run: python -u render_cards.py
      - name: 결과 저장
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add daily blog post
          if git diff --staged --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "daily post"
            for i in 1 2 3 4 5; do
              if git push; then break; fi
              git fetch origin main
              git rebase origin/main
              [ "$i" -eq 5 ] && exit 1
            done
          fi
