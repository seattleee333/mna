name: 상장사 대표 보수 순위 수집

on:
  workflow_dispatch:
  push:
    paths:
      - fetch_exec_pay.py

permissions:
  contents: write

concurrency:
  group: exec-pay
  cancel-in-progress: false

jobs:
  pay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: 대표 보수 순위 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python -u fetch_exec_pay.py
      - name: 결과 저장
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          for f in exec_pay_*.json exec_pay_debug.txt; do [ -f "$f" ] && git add "$f"; done
          if git diff --staged --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "update exec pay"
            for i in 1 2 3 4 5; do
              if git push; then break; fi
              git fetch origin main
              git rebase origin/main
              [ "$i" -eq 5 ] && exit 1
            done
          fi
