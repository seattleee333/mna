name: M&A 통계 집계 (DART 5년)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 1"   # 매주 화요일 05:00 KST (이어하기 캐시로 증분 갱신)

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: DART 5년 M&A 통계 집계
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python -u fetch_ma_stats.py
      - name: 결과 저장
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          for f in ma_stats.json ma_cache.json ma_stats_log.txt; do [ -f "$f" ] && git add "$f"; done
          if git diff --staged --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "update ma_stats"
            for i in 1 2 3 4 5; do
              if git push; then break; fi
              git fetch origin main
              git rebase origin/main
              [ "$i" -eq 5 ] && exit 1
            done
          fi
