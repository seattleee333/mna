name: 5년 M&A 사례 목록 수집

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 2"   # 매주 화요일 12:00 KST (ma_stats 갱신 뒤)

permissions:
  contents: write

jobs:
  cases:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests openpyxl
      - name: 사례 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python -u fetch_ma_cases.py
      - name: 사례 리스트 화면용 데이터 생성
        run: python -u build_cases_view.py
      - name: 결과 저장
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          for f in ma_cases.json ma_cases_view.json ma_cases_log.txt; do [ -f "$f" ] && git add "$f"; done
          if git diff --staged --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "update ma cases"
            for i in 1 2 3 4 5; do
              if git push; then break; fi
              git fetch origin main
              git rebase origin/main
              [ "$i" -eq 5 ] && exit 1
            done
          fi
