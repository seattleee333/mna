name: DART M&A 수집

on:
  schedule:
    - cron: "0 22 * * *"   # 매일 한국시간 오전 7시
  workflow_dispatch:
    inputs:
      days:
        description: "며칠치를 가져올까요"
        default: "30"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: DART 공시 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DAYS: ${{ github.event.inputs.days || '7' }}
        run: python fetch_deals.py

      - name: M&A 인기뉴스 수집
        run: python fetch_news.py

      - name: 매물·인수희망 리스트 수집
        run: python fetch_listings.py

      - name: 업종별 피어 배수 수집
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python fetch_peers.py

      - name: 결과 저장
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add deals.json news.json listings.json peers.json
          if git diff --staged --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "update deals/news/listings"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "push 성공"
                break
              fi
              echo "push 실패, 재시도 ($i) - rebase 후 재시도"
              git fetch origin main
              git rebase origin/main
              if [ "$i" -eq 5 ]; then
                echo "push 5회 재시도 후 실패"
                exit 1
              fi
            done
          fi
