name: 매경 기사 점검 (임시)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dbg:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python debug_mk.py
      - if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          [ -f mk_debug.txt ] && git add mk_debug.txt
          git commit -m "mk debug" || true
          git pull --rebase origin main || true
          git push || true
