name: 일본·중국 M&A 공시 수집

on:
  schedule:
    - cron: "20 0,9 * * *"   # 매일 09:20, 18:20 KST
  workflow_dispatch:
  push:
    paths:
      - fetch_asia_deals.py
      - .github/workflows/asia_deals.yml

permissions:
  contents: write

concurrency:
  group: asia-deals
  cancel-in-progress: false

jobs:
  asia:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python -u fetch_asia_deals.py
      - name: 결과 저장
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          for f in asia_deals.json asia_log.txt; do [ -f "$f" ] && git add "$f"; done
          if git diff --staged --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "update asia deals"
            for i in 1 2 3 4 5; do
              if git push; then break; fi
              git fetch origin main
              git rebase origin/main
              [ "$i" -eq 5 ] && exit 1
            done
          fi
