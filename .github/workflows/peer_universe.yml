name: 피어그룹 평가용 전 상장사 데이터 갱신

on:
  schedule:
    - cron: "40 17 * * *"   # 매일 02:40 KST (호출 한도 안에서 보고서가 바뀐 회사만 다시 받음)
  workflow_dispatch:
  push:
    paths:
      - fetch_peer_universe.py

permissions:
  contents: write

concurrency:
  group: peer-universe
  cancel-in-progress: false

jobs:
  universe:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: 전 상장사 TTM·재무상태·주식수·6개월 평균주가 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          PEER_BUDGET: "9000"
        run: python fetch_peer_universe.py
      - name: 결과 저장
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          [ -f peer_universe.json ] && git add peer_universe.json
          if git diff --staged --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "update peer universe"
            for i in 1 2 3 4 5; do
              if git push; then break; fi
              git fetch origin main
              git rebase origin/main
              [ "$i" -eq 5 ] && exit 1
            done
          fi
